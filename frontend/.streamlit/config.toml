[theme]
primaryColor = "#34D399"
backgroundColor = "#070A0F"
secondaryBackgroundColor = "#121B2A"
textColor = "#F8FAFC"
font = "sans serif"

[server]
maxUploadSize = 10
enableXsrfProtection = false
enableCORS = false
headless = true

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = true
toolbarMode = "minimal"
